services:
  - type: web
    name: f1-signal-alarm
    runtime: docker
    plan: free
    region: frankfurt          # must be non-US: Binance returns HTTP 451 to US IPs
    healthCheckPath: /
    envVars:
      # Generated so the instance is never publicly open, even on first boot.
      # The Telegram credentials are set through the API after the service exists,
      # to keep them out of this public repo.
      - key: APP_PASSWORD
        generateValue: true
