# Trade calls (docs/calls.html), every 5 minutes for real.
#
# GitHub throttles `schedule` hard on this repo — the */5 scanner actually runs
# every 3–5 hours. So this job doesn't rely on the schedule: one run stays up
# for ~5h40m, runs calls.js right after every 5-minute candle closes, publishes
# calls.json on the orphan `calls` branch, and re-dispatches itself before it
# ends. The cron below only restarts the chain if it ever breaks.
# Public repo: Actions minutes are free.
name: calls

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: calls
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write        # force-pushes the calls branch
      actions: write         # re-dispatches this workflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore calls
        run: |
          mkdir -p cloud
          if git fetch --depth=1 origin calls 2>/dev/null; then
            git show FETCH_HEAD:calls.json > cloud/calls.json && echo "restored"
          else
            echo "no calls branch yet"
          fi

      - name: Scan every 5 minutes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          end=$(( $(date +%s) + 335 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            timeout 180 node calls.js || echo "calls.js failed — keeping the last good file"
            if [ -f cloud/calls.json ]; then
              pub=$(mktemp -d)
              cp cloud/calls.json "$pub"/
              ( cd "$pub" && git init -q -b calls \
                && git config user.name "f1-alarm bot" \
                && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
                && git add . && git commit -qm "calls @ $(date -u +%FT%TZ)" \
                && git push -q --force "$PUSH_URL" calls ) || echo "publish failed"
              rm -rf "$pub"
            fi
            # wake 20 s after the next 5-minute candle closes
            now=$(date +%s); sleep $(( 300 - now % 300 + 20 ))
          done

      - name: Hand over to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run calls.yml --repo ${{ github.repository }}
