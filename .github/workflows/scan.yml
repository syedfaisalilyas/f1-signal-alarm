# The scanner, running where your laptop doesn't have to be.
#
# Alerts are the point here: signals go to Telegram. Live state is kept on the
# orphan `state` branch as one force-pushed commit — a scan every 5 minutes
# would otherwise pile ~288 commits a day onto main.
name: scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Also send a test alert to Telegram'
        type: boolean
        default: false

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write        # force-pushes the state branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      # Previous run's state. git fetch, not raw.githubusercontent — that CDN
      # caches for ~5 min and stale marks would re-fire alerts already sent.
      - name: Restore state
        run: |
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json > cloud/state.json
            echo "restored state from branch"
          else
            echo "no state branch yet — seeding from the committed watchlist"
          fi

      - name: Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scan.js

      # Signals are rare, so this is the way to confirm delivery still works
      # without waiting for the market to give you one.
      - name: Test alert
        if: inputs.test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e '
            const t = process.env.TELEGRAM_TOKEN, chat = process.env.TELEGRAM_CHAT_ID;
            const text = "\u2705 <b>F1 Alarm</b> \u2014 cloud scanner is alive\nScanning every 5 min on GitHub Actions.";
            fetch(`https://api.telegram.org/bot${t}/sendMessage`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chat_id: chat, text, parse_mode: "HTML" })
            }).then(async r => {
              console.log("telegram", r.status, (await r.text()).slice(0, 120));
              if (!r.ok) process.exit(1);
            });
          '

      - name: Publish state
        run: |
          pub=$(mktemp -d)
          cp cloud/state.json cloud/snapshot.json "$pub"/
          [ -f cloud/leverage.json ] && cp cloud/leverage.json "$pub"/
          cd "$pub"
          git init -q -b state
          git config user.name "f1-alarm bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "state @ $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
