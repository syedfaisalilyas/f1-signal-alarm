name: probe-geo
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Endpoint reachability
        run: |
          probe () {
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 "$2" || echo 000)
            printf '%s  %-28s ' "$code" "$1"
            head -c 110 /tmp/body; echo
          }
          probe "binance-vision spot 3m"  "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=3m&limit=2"
          probe "binance-vision memecoin" "https://data-api.binance.vision/api/v3/klines?symbol=PEPEUSDT&interval=3m&limit=2"
          probe "binance-vision ticker"   "https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT"
          probe "binance-vision exchInfo" "https://data-api.binance.vision/api/v3/exchangeInfo?symbol=BTCUSDT"
          probe "mexc spot 5m"            "https://api.mexc.com/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=2"
          probe "mexc contract kline"     "https://contract.mexc.com/api/v1/contract/kline/BTC_USDT?interval=Min5&start=$(($(date +%s)-3600))"
          probe "mexc contract detail"    "https://contract.mexc.com/api/v1/contract/detail?symbol=BTC_USDT"
          probe "okx candles"             "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=3m&limit=2"
          probe "gateio candles"          "https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=BTC_USDT&interval=3m&limit=2"
