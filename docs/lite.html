<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>F1 Alarm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔔</text></svg>">
<style>
  :root{
    --bg:#0b0e14; --panel:#131822; --panel2:#1a2130; --line:#232c3d;
    --fg:#e6edf6; --dim:#8b9bb4; --faint:#5d6b82;
    --up:#26d07c; --down:#ff5470; --warn:#ffb02e; --info:#4aa8ff; --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,system-ui,sans-serif;
    padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
  header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:16px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
  h1{font-size:17px;margin:0;letter-spacing:.2px}
  .meta{color:var(--dim);font-size:12.5px;margin-left:auto;text-align:right}
  main{padding:14px 16px;max-width:760px;margin:0 auto}
  .grid{display:grid;gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
  .top{display:flex;align-items:center;gap:8px}
  .sym{font-weight:650;letter-spacing:.3px}
  .iv{color:var(--faint);font-size:12px;background:var(--panel2);border-radius:6px;padding:1px 6px}
  .price{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
  .badge{font-size:11.5px;font-weight:650;border-radius:999px;padding:2px 9px;letter-spacing:.4px}
  .long{background:rgba(38,208,124,.14);color:var(--up)}
  .short{background:rgba(255,84,112,.14);color:var(--down)}
  .flat{background:var(--panel2);color:var(--faint)}
  .soon{background:rgba(255,176,46,.14);color:var(--warn)}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;color:var(--dim);font-size:12.5px;
    font-variant-numeric:tabular-nums}
  .lvl{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-top:11px}
  .lvl div{background:var(--panel2);border-radius:9px;padding:6px 8px}
  .lvl b{display:block;font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.5px}
  .lvl span{font-variant-numeric:tabular-nums;font-size:13px}
  .err{color:var(--down);font-size:12.5px;margin-top:8px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--faint);
    margin:26px 0 9px;font-weight:650}
  .alert{border-left:2px solid var(--line);padding:8px 0 8px 11px;margin-bottom:2px}
  .alert .k{font-size:11px;font-weight:700;letter-spacing:.5px}
  .alert.ENTRY{border-left-color:var(--up)} .alert.ENTRY .k{color:var(--up)}
  .alert.EXIT{border-left-color:var(--info)} .alert.EXIT .k{color:var(--info)}
  .alert.PREALERT{border-left-color:var(--warn)} .alert.PREALERT .k{color:var(--warn)}
  .alert .t{color:var(--faint);font-size:11.5px;margin-left:6px}
  .alert p{margin:3px 0 0;color:var(--dim);font-size:13px;white-space:pre-wrap}
  .empty{color:var(--faint);font-size:13.5px;padding:10px 0}
  a{color:var(--info)}
  .stale{color:var(--warn)}
</style>

<header>
  <h1>F1 Alarm</h1>
  <span id="src" class="iv"></span>
  <div class="meta"><span id="when">loading…</span><br><span id="next" class="iv"></span></div>
</header>

<main>
  <div id="cards" class="grid"></div>
  <h2>Recent alerts</h2>
  <div id="alerts"></div>
  <p class="empty">Scans run every 5 minutes on GitHub Actions — this page just reads what they publish.
    Alerts arrive on Telegram; this is the read-only view.
    <a href="https://github.com/syedfaisalilyas/f1-signal-alarm/actions/workflows/scan.yml">Run history</a></p>
</main>

<script>
const SNAP = 'https://raw.githubusercontent.com/syedfaisalilyas/f1-signal-alarm/state/snapshot.json';
const num = v => v === null || v === undefined || Number.isNaN(v) ? '—'
  : Math.abs(v) >= 1000 ? v.toFixed(2) : Math.abs(v) >= 1 ? v.toFixed(4) : (+v).toPrecision(5);

function ago(ts){
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 90) return Math.round(s) + 's ago';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}

function card(w){
  const a = w.analysis;
  const el = document.createElement('div');
  el.className = 'card';
  if (!a) {
    el.innerHTML = `<div class="top"><span class="sym">${w.symbol}</span><span class="iv">${w.interval}</span></div>
      <div class="err">${w.error || 'no data'}</div>`;
    return el;
  }
  const p = a.position, f = a.forecast;
  const badge = p ? `<span class="badge ${p.side.toLowerCase()}">${p.side}</span>`
    : f?.imminent ? `<span class="badge soon">${f.side} SOON</span>`
    : `<span class="badge flat">FLAT</span>`;
  const levels = p ? `<div class="lvl">
      <div><b>ENTRY</b><span>${num(p.entry)}</span></div>
      <div><b>STOP</b><span>${num(p.sl)}</span></div>
      <div><b>TP1</b><span>${num(p.tp1)}</span></div>
      <div><b>TP2</b><span>${num(p.tp2)}</span></div>
    </div>` : '';
  el.innerHTML = `<div class="top">
      <span class="sym">${w.symbol}</span><span class="iv">${w.interval}</span>${badge}
      <span class="price">${num(a.price)}</span>
    </div>
    <div class="stats">
      <span>RSI ${a.rsi?.toFixed(1) ?? '—'}</span>
      <span>ATR ${a.atrPct?.toFixed(2) ?? '—'}%</span>
      <span>vol ×${a.volRatio?.toFixed(2) ?? '—'}</span>
      <span>bar ${a.lastClosedTime ? new Date(a.lastClosedTime).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '—'}</span>
    </div>${levels}`;
  return el;
}

async function load(){
  let s;
  try {
    const res = await fetch(SNAP + '?t=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error(res.status === 404 ? 'no scan published yet' : 'HTTP ' + res.status);
    s = await res.json();
  } catch (e) {
    document.getElementById('when').textContent = String(e.message);
    return;
  }

  const when = document.getElementById('when');
  when.textContent = 'scanned ' + ago(s.at);
  // Scans are 5 minutes apart; well past that means the schedule stalled.
  when.className = Date.now() - s.at > 20 * 60 * 1000 ? 'stale' : '';
  document.getElementById('next').textContent = new Date(s.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  document.getElementById('src').textContent = s.sources
    ? `spot ${s.sources.spot} · perps ${s.sources.futures}` : '';

  const cards = document.getElementById('cards');
  cards.replaceChildren(...s.watches.map(card));

  const box = document.getElementById('alerts');
  box.replaceChildren();
  if (!s.alerts?.length) {
    box.innerHTML = '<div class="empty">Nothing fired yet.</div>';
  } else {
    for (const al of s.alerts.slice(0, 20)) {
      const d = document.createElement('div');
      d.className = 'alert ' + al.kind;
      d.innerHTML = `<span class="k">${al.kind}</span> ${al.symbol} ${al.interval}
        <span class="t">${ago(al.at)}</span><p>${(al.body || '').replace(/</g,'&lt;')}</p>`;
      box.append(d);
    }
  }
}

load();
setInterval(load, 30000);
document.addEventListener('visibilitychange', () => !document.hidden && load());
</script>
